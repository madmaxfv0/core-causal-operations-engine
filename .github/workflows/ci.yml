name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.lock
      - name: Install pinned dependencies
        run: pip install -r deploy/requirements.lock pytest
      # Tests that need the downloaded Alberta public data skip themselves.
      - name: Run the test suite
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.lock
      - name: Start the API on the bundled synthetic data
        run: |
          pip install -r deploy/requirements.lock
          uvicorn backend.api.main:app --port 8000 &
          for i in $(seq 1 60); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Render every route against the API
        working-directory: frontend
        run: |
          npm install --no-save jsdom@24
          node smoke.mjs
